[package]
name = "lite-xmr"
version = "0.1.1"
edition = "2024"
authors = ["lite-xmr contributors"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
rustls-pemfile = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
pico-args = "0.5"
anyhow = "1"
thiserror = "1"
randomx-rs = "1.4"
hex = "0.4"
toml = "0.8"
sysinfo = "0.30"
num_cpus = "1"
raw-cpuid = "11"
hwlocality = { version = "1.0.0-alpha.12", features = ["vendored"] }
ureq = "3"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[[bin]]
name = "lite-xmr"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
