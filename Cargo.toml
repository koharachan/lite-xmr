[workspace]
members = [
    "crates/lite-xmr-core",
    "crates/lite-xmr-stratum",
    "crates/lite-xmr-miner",
    "crates/lite-xmr-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0"
authors = ["lite-xmr contributors"]
version = "0.1.0"

[workspace.dependencies]
# Internal crates
lite-xmr-core   = { path = "crates/lite-xmr-core" }
lite-xmr-stratum = { path = "crates/lite-xmr-stratum" }
lite-xmr-miner  = { path = "crates/lite-xmr-miner" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TLS (pure Rust, no OpenSSL)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
rustls-pemfile = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

# CLI - use structopt-like API via pico-args to avoid clap_lex edition2024 issue
pico-args = "0.5"

# Error handling
anyhow = "1"
thiserror = "1"

# Crypto / RandomX
randomx-rs = "1.4"
hex = "0.4"

# System info
sysinfo = "0.30"
num_cpus = "1"
raw-cpuid = "11"

# Networking
tokio-socks = "0.5"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
